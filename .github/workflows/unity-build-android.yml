name: Unity Build Android

on:
  push:
    tags:
      - v*
      - dev*
  pull_request:
    types: [ labeled, synchronize ]
env:
  UNITY_VERSION: 6000.3.28f1
  
concurrency:
  group: unity-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
  
jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        contains(github.event.pull_request.labels.*.name, 'build-unity') &&
        github.event.pull_request.head.repo.full_name == github.repository
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Cache Library Restore
        uses: actions/cache/restore@v6
        with:
          path: Library
          key: Library-Lumisie
          restore-keys: |
            Library-

      - name: Build Android
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: Android
          buildName: Lumisie
          buildMethod: NugetForUnity.NugetHelper.Restore
          
      - name: Upload Build Artifact
        uses: softprops/action-gh-release@v3
        with:
          files: build/Android/Lumisie.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Library Save
        uses: actions/cache/save@v6
        if: always()
        with:
          path: Library
          key: Library-Lumisie