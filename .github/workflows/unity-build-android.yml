name: Unity Build Android

on:
  push:
    branches:
      - main
  pull_request: 
    branches:
      - main

env:
  UNITY_EDITOR_VERSION: "6000.3.11f1"
  UNITY_CLI_CHANNEL: beta
  UNITY_NON_INTERACTIVE: "1"
  UNITY_NO_CONSENT_PROMPT: "1"
  UNITY_NO_CRASH_REPORT: "1"
  UNITY_NO_UPDATE_CHECK: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout"
        uses: actions/checkout@v7
      - name: Install Unity CLI
        run: |
          curl -fsSL https://public-cdn.cloud.unity3d.com/hub/prod/cli/install.sh | UNITY_CLI_CHANNEL=beta bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          unity --version

      - name: Install Unity Editor
        run: |
          unity install "$UNITY_EDITOR_VERSION" -m android --yes --accept-eula
          unity editors -i

      - name: Activate license (Pro / serial)
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          EDITOR_PATH=$(unity editors -i --format json | jq -r --arg v "$UNITY_EDITOR_VERSION" '.[] | select(.version==$v) | .path' | head -n1)
          if [ -z "$EDITOR_PATH" ]; then
            EDITOR_PATH=$(find /opt /home -name Unity -type f 2>/dev/null | head -n1)
          fi
          echo "Using editor: $EDITOR_PATH"
          "$EDITOR_PATH" -batchmode -nographics -quit \
            -username "$UNITY_EMAIL" \
            -password "$UNITY_PASSWORD" \
            -logFile -
      - name: Build Android
        run: |
          unity build "$GITHUB_WORKSPACE" \
          --target Android \
          --execute-method Builder.AndroidBuild \
          --output-path ./Builds/Lumisie.apk
          
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-build
          path: ./Builds/Lumisie.apk

      - name: Return license
        if: always()
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          EDITOR_PATH=$(unity editors -i --format json | jq -r --arg v "$UNITY_EDITOR_VERSION" '.[] | select(.version==$v) | .path' | head -n1)
          if [ -z "$EDITOR_PATH" ]; then
            EDITOR_PATH=$(find /opt /home -name Unity -type f 2>/dev/null | head -n1)
          fi
          echo "Returning license with: $EDITOR_PATH"
          "$EDITOR_PATH" -batchmode -nographics -quit \
            -returnlicense \
            -username "$UNITY_EMAIL" \
            -password "$UNITY_PASSWORD" \
            -logFile - || true