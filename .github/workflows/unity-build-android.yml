name: Unity Build Android

on:
  push:
    branches:
      - main
  pull_request: 
    branches:
      - main
env:
  ARTIFACT_NAME: Lumisie
  BUILD_OUTPUT: build/android
  UNITY_VERSION: 6000.3.11f1

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Cache Unity Editor
        uses: actions/cache@v6
        with:
          path: /opt/Unity
          key: unity-editor-${{ env.UNITY_VERSION }}
          restore-keys: |
            unity-editor-
            
      - name: Cache Library
        uses: actions/cache@v6
        with:
          path: $GITHUB_WORKSPACE/Library
          key: Library-Lumisie-TargetPlatform
          restore-keys: |
            Library-Lumisie-
            Library-
            
      - name: Build Android
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: Android
          buildName: ${{ env.ARTIFACT_NAME }}
          buildsPath: ${{ env.BUILD_OUTPUT }}

      - name: Upload Build Artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.BUILD_OUTPUT }}
