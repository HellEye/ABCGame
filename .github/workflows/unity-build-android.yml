name: Unity Build Android

#on:
#  push:
#    tags:
#      - 'v*'

on:
  pull_request:
    branches:
      - main

env:
  ARTIFACT_NAME: Lumisie
  BUILD_OUTPUT: build/android
  UNITY_VERSION: 6000.3.11f1

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          
      - name: Install Unity CLI
        run: |
          curl -fsSL https://public-cdn.cloud.unity3d.com/hub/prod/cli/install.sh | UNITY_CLI_CHANNEL=beta bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          unity --version
          
      - name: Cache Editor
        uses: actions/cache/restore@v6
        id: cache-editor
        if: always()
        with:
          path: /home/runner/Unity/Hub/Editor/${{ env.UNITY_EDITOR_VERSION }}
          key: unity-editor-${{ env.UNITY_EDITOR_VERSION }}-${{ runner.os }}
          restore-keys: |
            unity-editor-${{ env.UNITY_EDITOR_VERSION }}-${{ runner.os }}
      
      - name: Cache Library
        uses: actions/cache/restore@v6
        if: always()
        with:
          path: $GITHUB_WORKSPACE/Library
          key: Library-Lumisie-Android
          restore-keys: |
            Library-Lumisie-
            Library-
        
      - name: Install Unity Editor
        if: steps.cache-editor.outputs.cache-hit != 'true'
        run: |
          unity install "$UNITY_EDITOR_VERSION" -m android --yes --accept-eula
          unity editors -i
        
      - name: Activate license
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          mkdir -p ~/.local/share/unity3d/Unity
          echo "$UNITY_LICENSE" > ~/.local/share/unity3d/Unity/Unity_lic.ulf
          
      - name: Build Android
        run: |
          unity build "$GITHUB_WORKSPACE" \
          --target Android \
          --execute-method Builder.AndroidBuild \
          --output-path ${{ env.BUILD_OUTPUT }}/${{ env.ARTIFACT_NAME }}

      - name: Upload Build Artifact
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.BUILD_OUTPUT }}/${{ env.ARTIFACT_NAME }}.apk
      
      - name: Upload cache library
        uses: actions/cache/save@v6
        if: always()
        with:
          path: $GITHUB_WORKSPACE/Library
          key: Library-Lumisie-Android
      
      - name: Upload cache editor
        uses: actions/cache/save@v6
        if: always()
        with:
          path: /home/runner/Unity/Hub/Editor/${{ env.UNITY_EDITOR_VERSION }}
          key: unity-editor-${{ env.UNITY_EDITOR_VERSION }}-${{ runner.os }}
